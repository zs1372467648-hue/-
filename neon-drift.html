<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON DRIFT · 霓虹漂移</title>
<style>
  *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070714;color:#e9eeff;font-family:"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
  #shell{position:relative;width:min(94vw,880px);aspect-ratio:16/10;border:1px solid #5748ba;border-radius:18px;overflow:hidden;box-shadow:0 0 60px #332a8b66;background:#08091c} canvas{width:100%;height:100%;display:block}
  #hud{position:absolute;inset:0;padding:20px;pointer-events:none;text-shadow:0 0 10px #8d7cff;letter-spacing:.08em} .top{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.value{font-size:24px;color:#5eeaff}.hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:12px;color:#bac1e8}
  #panel{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#08091c77,#08091ce6);text-align:center;padding:20px} #card{max-width:480px} h1{font-size:clamp(31px,6vw,58px);margin:0;color:#80f6ff;letter-spacing:.12em;text-shadow:0 0 18px #00c7ff} h2{margin:8px 0 24px;color:#c4b8ff;font-size:15px;letter-spacing:.35em} p{line-height:1.8;color:#c5c9e5;font-size:14px}button{cursor:pointer;margin-top:15px;border:0;border-radius:100px;background:#65e8ff;color:#06111e;font-weight:900;letter-spacing:.15em;padding:14px 29px;font-size:15px;box-shadow:0 0 25px #46d8ff;transition:.2s}button:hover{transform:scale(1.05);box-shadow:0 0 40px #46d8ff} .tiny{font-size:11px;opacity:.65;margin-top:17px}
</style>
</head>
<body><div id="shell"><canvas id="game"></canvas><div id="hud"><div class="top"><div>得分 <span class="value" id="score">0</span></div><div>能量 <span class="value" id="energy">100</span></div><div>最高 <span class="value" id="best">0</span></div></div><div class="hint">← → / A D 移动 · 收集星核 · 避开陨石 · 空格启动脉冲</div></div><div id="panel"><div id="card"><h1>NEON DRIFT</h1><h2>霓 虹 漂 移</h2><p>穿过不断坍缩的星际矿带。<br>蓝色星核恢复能量，紫色脉冲可清除附近陨石。</p><button id="start">开始航行</button><p class="tiny">支持键盘与鼠标 / 触屏拖动</p></div></div></div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),panel=document.querySelector('#panel'),start=document.querySelector('#start');let W,H,run,last,score,energy,ship,rocks,cores,stars,keys={},pulse=0,elapsed=0,best=+localStorage.neonDriftBest||0;
document.querySelector('#best').textContent=best;
function resize(){let r=c.getBoundingClientRect(),d=devicePixelRatio;c.width=r.width*d;c.height=r.height*d;W=c.width;H=c.height;x.setTransform(1,0,0,1,0,0)}addEventListener('resize',resize);resize();
function reset(){score=0;energy=100;elapsed=0;ship={x:W/2,y:H*.80,v:0};rocks=[];cores=[];stars=Array.from({length:150},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+1}));pulse=0;run=true;panel.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function add(){let hard=1+elapsed/18000;if(Math.random()<.68)rocks.push({x:30+Math.random()*(W-60),y:-40,r:17+Math.random()*24,v:(2+Math.random()*3)*hard,spin:Math.random()*6});else cores.push({x:30+Math.random()*(W-60),y:-25,r:13,v:2.5*hard})}
function boom(){if(pulse>0||energy<18)return;energy-=18;pulse=1;rocks=rocks.filter(o=>{let dx=o.x-ship.x,dy=o.y-ship.y;if(dx*dx+dy*dy<220*220){score+=15;return false}return true})}
function loop(t){if(!run)return;let dt=Math.min(32,t-last);last=t;elapsed+=dt;score+=dt*.018;let move=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);ship.v+=(move*.80-ship.v*.13);ship.x=Math.max(25,Math.min(W-25,ship.x+ship.v*dt/16));if(Math.random()<dt/700)add();stars.forEach(s=>{s.y+=s.z*dt/6;if(s.y>H){s.y=0;s.x=Math.random()*W}});rocks.forEach(o=>{o.y+=o.v*dt/8;o.spin+=.05});cores.forEach(o=>o.y+=o.v*dt/8);for(let a of rocks){let dx=a.x-ship.x,dy=a.y-ship.y;if(dx*dx+dy*dy<(a.r+18)**2){energy-=.75; a.y=H+90}}for(let a of cores){let dx=a.x-ship.x,dy=a.y-ship.y;if(dx*dx+dy*dy<(a.r+22)**2){energy=Math.min(100,energy+20);score+=30;a.y=H+90}}rocks=rocks.filter(o=>o.y<H+90);cores=cores.filter(o=>o.y<H+50);pulse=Math.max(0,pulse-dt/500);energy-=dt*.0025;if(energy<=0)return over();draw();document.querySelector('#score').textContent=Math.floor(score);document.querySelector('#energy').textContent=Math.max(0,Math.ceil(energy));requestAnimationFrame(loop)}
function glow(color,b=20){x.shadowColor=color;x.shadowBlur=b;x.strokeStyle=color;x.fillStyle=color}function draw(){x.fillStyle='#08091c';x.fillRect(0,0,W,H);stars.forEach(s=>{x.fillStyle='#a9ceff';x.globalAlpha=s.z/3;x.fillRect(s.x,s.y,s.z,s.z)});x.globalAlpha=1; rocks.forEach(o=>{x.save();x.translate(o.x,o.y);x.rotate(o.spin);glow('#ff5a9b',12);x.beginPath();for(let i=0;i<9;i++){let r=o.r*(.75+Math.sin(i*7)*.19),a=i*Math.PI*2/9;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fillStyle='#5c2049';x.fill();x.stroke();x.restore()});cores.forEach(o=>{glow('#4beeff',25);x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fillStyle='#bdffff';x.fill()});if(pulse){glow('#b979ff',45);x.globalAlpha=pulse*.55;x.beginPath();x.arc(ship.x,ship.y,(1-pulse)*220,0,7);x.stroke();x.globalAlpha=1}x.save();x.translate(ship.x,ship.y);x.rotate(ship.v*.025);glow('#6df5ff',25);x.beginPath();x.moveTo(0,-28);x.lineTo(20,23);x.lineTo(0,15);x.lineTo(-20,23);x.closePath();x.fillStyle='#1673ae';x.fill();x.stroke();glow('#fff',16);x.fillRect(-3,-9,6,14);x.restore();let g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#ff5a9b');g.addColorStop(1,'#4beeff');x.fillStyle='#10142d';x.fillRect(18,55,W-36,5);x.fillStyle=g;x.fillRect(18,55,(W-36)*energy/100,5)}
function over(){run=false;best=Math.max(best,Math.floor(score));localStorage.neonDriftBest=best;document.querySelector('#best').textContent=best;panel.style.display='grid';document.querySelector('#card').innerHTML=`<h1>航行结束</h1><h2>本次得分 ${Math.floor(score)}</h2><p>${score>500?'你在星尘中划出了一条漂亮的轨迹。':'再试一次，星海不会为任何人减速。'}</p><button id="start">再次航行</button><p class="tiny">最高纪录 ${best}</p>`;document.querySelector('#start').onclick=reset}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){e.preventDefault();boom()}});addEventListener('keyup',e=>keys[e.key]=false);function aim(e){let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;ship&& (ship.x=(p.clientX-r.left)/r.width*W)}c.addEventListener('pointermove',aim);c.addEventListener('pointerdown',e=>{aim(e);boom()});start.onclick=reset;
</script></body></html>
